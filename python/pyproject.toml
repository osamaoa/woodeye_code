[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "woodeye-alignment"
version = "1.0.0"
description = "Optical-to-CT landmark alignment and paired patch export tool for timber beam scans."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Musab Ahmed", email = "musab.ahmed1996@gmail.com" }]
dependencies = [
  "jinja2>=3.1,<4",
  "numpy>=1.26,<3",
  "opencv-python>=4.8,<5",
  "pydantic>=2.6,<3",
  "pyqt6>=6.6,<7",
  "pyqtgraph>=0.13,<0.14",
  "scikit-image>=0.22,<1",
  "scipy>=1.11,<2",
  "tqdm>=4.66,<5",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.8,<2",
  "pillow>=10,<13",
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "pytest-qt>=4.4,<5",
  "ruff>=0.4,<1",
]

[project.scripts]
woodeye-align = "woodeye_alignment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
woodeye_alignment = ["resources/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "qt: PyQt widget smoke tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["A", "B", "C4", "E", "F", "I", "N", "NPY", "RUF", "SIM", "UP", "W"]
ignore = ["A003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
namespace_packages = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "cv2.*",
  "pyqtgraph.*",
  "skimage.*",
  "tqdm.*",
]
ignore_missing_imports = true
